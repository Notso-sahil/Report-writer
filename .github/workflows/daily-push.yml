name: Daily Automated 5-Commits Push

on:
  schedule:
    # Runs everyday at 04:00 UTC (09:30 AM IST)
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      commit_count:
        description: 'Number of commits to push today'
        required: false
        default: '5'

permissions:
  contents: write

jobs:
  push-daily-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a PAT so commits are attributed to your GitHub account
          # and appear as personal contributions on your profile graph.
          # Steps to create:
          #   1. Go to https://github.com/settings/tokens → Generate new token (classic)
          #   2. Select 'repo' scope → Generate token → Copy it
          #   3. In this repo: Settings → Secrets and variables → Actions
          #   4. Add secret named: GH_PAT  (paste token value)
          #   5. Add secret named: GH_EMAIL (your GitHub account email)
          token: ${{ secrets.GH_PAT }}

      - name: Setup Git user identity
        run: |
          # Must match your actual GitHub username and account email
          # so contributions are counted on your profile graph
          git config user.name "Notso-sahil"
          git config user.email "${{ secrets.GH_EMAIL }}"

      - name: Advance main branch by scheduled commits
        run: |
          # Fetch both branches to ensure latest refs
          git fetch origin release-queue main || true

          # Check if release-queue exists on origin
          if ! git rev-parse --verify origin/release-queue >/dev/null 2>&1; then
            echo "Branch 'origin/release-queue' not found. Nothing left to push."
            exit 0
          fi

          # Switch to main branch
          git checkout main
          git reset --hard origin/main

          # List pending commits in chronological order (oldest first)
          PENDING_COMMITS=$(git log --reverse --format="%H" origin/main..origin/release-queue)

          if [ -z "$PENDING_COMMITS" ]; then
            echo "All commits from release-queue have already been pushed to main!"
            exit 0
          fi

          # Use shell default fallback — fixes silent failure on scheduled (non-dispatch) runs
          INPUT_COUNT="${{ github.event.inputs.commit_count }}"
          BATCH_SIZE="${INPUT_COUNT:-5}"
          echo "Batch size: $BATCH_SIZE"

          # Select commits up to batch size
          COMMITS_TO_PUSH=$(echo "$PENDING_COMMITS" | head -n "$BATCH_SIZE")
          ACTUAL_COUNT=$(echo "$COMMITS_TO_PUSH" | wc -l | tr -d ' ')

          echo "Pushing $ACTUAL_COUNT commit(s) to main (cherry-pick with author rewrite)..."

          # Cherry-pick each commit individually, rewriting authorship so each
          # commit shows YOUR identity (not the bot's) → counted as contributions
          for COMMIT in $COMMITS_TO_PUSH; do
            MSG=$(git log -1 --format="%s" "$COMMIT")
            git cherry-pick --no-commit "$COMMIT" 2>/dev/null || true
            git commit --allow-empty -m "$MSG" \
              --author="Notso-sahil <${{ secrets.GH_EMAIL }}>"
          done

          # Push to origin main
          git push origin main

          TOTAL_PENDING=$(echo "$PENDING_COMMITS" | wc -l | tr -d ' ')
          REMAINING=$((TOTAL_PENDING - ACTUAL_COUNT))
          echo "Done. Pushed $ACTUAL_COUNT commit(s). $REMAINING commit(s) remaining."
